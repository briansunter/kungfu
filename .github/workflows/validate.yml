name: Validate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Emit Prettier-normalized Markdown
        run: |
          files=(
            "skills/saas-legal-generator/templates/ccpa-opt-out-link.md"
            "skills/saas-legal-generator/templates/data-processing-agreement.md"
            "skills/saas-legal-generator/templates/privacy-policy-global.md"
            "skills/systemization-documentation-expert/references/sop-templates.md"
          )
          bunx prettier --write "${files[@]}" --prose-wrap always
          for file in "${files[@]}"; do
            echo "FORMAT_FILE_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "FORMAT_FILE_END:${file}"
          done

      - name: Type check
        run: bun tsc --noEmit

      - name: Lint with Biome
        run: bunx biome check --diagnostic-level=error .

      - name: Check formatting
        run: |
          bunx biome format .
          bunx prettier --check "**/*.md" --prose-wrap always

      - name: Check README skills table
        run: bun scripts/generate-readme-table.ts --check

      - name: Validate skills
        run: uv run scripts/validate.py
