name: Validate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize Markdown
        run: |
          bunx prettier --write \
            skills/saas-legal-generator/templates/ccpa-opt-out-link.md \
            skills/saas-legal-generator/templates/data-processing-agreement.md \
            skills/saas-legal-generator/templates/privacy-policy-global.md \
            skills/systemization-documentation-expert/references/sop-templates.md \
            --prose-wrap always

      - name: Commit normalized Markdown
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- \
            skills/saas-legal-generator/templates/ccpa-opt-out-link.md \
            skills/saas-legal-generator/templates/data-processing-agreement.md \
            skills/saas-legal-generator/templates/privacy-policy-global.md \
            skills/systemization-documentation-expert/references/sop-templates.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/saas-legal-generator/templates/ccpa-opt-out-link.md \
            skills/saas-legal-generator/templates/data-processing-agreement.md \
            skills/saas-legal-generator/templates/privacy-policy-global.md \
            skills/systemization-documentation-expert/references/sop-templates.md
          git commit -m "Format Markdown"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Type check
        run: bun tsc --noEmit

      - name: Lint with Biome
        run: bunx biome check --diagnostic-level=error .

      - name: Check formatting
        run: |
          bunx biome format .
          bunx prettier --check "**/*.md" --prose-wrap always

      - name: Check README skills table
        run: bun scripts/generate-readme-table.ts --check

      - name: Validate skills
        run: uv run scripts/validate.py
